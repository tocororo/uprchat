[tool.poetry]
name = "uprchat"
version = "0.1.0"
description = "university harvester, knowledge graph and graphRAG"
authors = ["Rafael Martinez Estevez <malayibiri@gmail.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.12.3"
fastapi = "^0.111.1"
Scrapy = "^2.11.2"
neo4j = "^5.22.0"
sqlmodel = "^0.0.22"
passlib = "^1.7.4"
bcrypt = "^4.2.0"
pydantic-settings = "^2.6.1"
psycopg2-binary = "^2.9.10"
jwt = "^1.3.1"
pyjwt = "^2.9.0"
python-multipart = "^0.0.17"
scikit-learn = "^1.5.2"
sentence-transformers = "^3.3.1"
langchain-ollama = "^0.2.2"
crawl4ai = "^0.6.0"
pymupdf = "^1.25.5"
langchain = {extras = ["openai"], version = "^0.3.25"}
langchain-community = "^0.3.23"
python-docx = "^1.1.2"
python-pptx = "^1.0.2"
langgraph = "^0.4.8"

[tool.poetry.group.dev.dependencies]
pylint = "^3.2.5"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "uprchat.app.main:start"
